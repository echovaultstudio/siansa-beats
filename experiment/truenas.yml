# Siansa Beats experiment on TrueNAS with an NVIDIA GPU: Apps › Discover Apps › ⋮ › Install via YAML, name it
# beats-experiment, paste this and Save. Then open http://<your TrueNAS>:8095 and sign in to Navidrome there: no
# password goes in this YAML. A trial: delete the app when it's done.
services:
  experiment:
    image: ghcr.io/echovaultstudio/siansa-beats:experiment
    container_name: beats-experiment
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      EXPERIMENT_DEVICE: "auto"
      NVIDIA_VISIBLE_DEVICES: "all"
    volumes:
      - experiment-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  experiment-data:
